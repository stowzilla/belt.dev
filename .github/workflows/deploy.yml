name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: GitHubActions-${{ github.run_id }}
          aws-region: us-east-1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.0
          terraform_wrapper: false

      - name: Install dependencies
        run: npm ci

      - name: Terraform Init
        working-directory: infrastructure
        run: terraform init

      # Apply first so the contact API exists and its URL can be baked into the build.
      - name: Terraform Apply
        working-directory: infrastructure
        run: terraform apply -auto-approve

      - name: Read Terraform outputs
        id: tf
        working-directory: infrastructure
        run: echo "contact_api_url=$(terraform output -raw contact_api_url)" >> "$GITHUB_OUTPUT"

      - name: Build
        run: npm run build
        env:
          VITE_CONTACT_API_URL: ${{ steps.tf.outputs.contact_api_url }}

      - name: Deploy to S3
        working-directory: infrastructure
        run: |
          S3_BUCKET=$(terraform output -raw s3_bucket_name)
          aws s3 sync ../build/ "s3://$S3_BUCKET" --delete

      - name: Invalidate CloudFront
        working-directory: infrastructure
        run: |
          CF_ID=$(terraform output -raw cloudfront_distribution_id)
          aws cloudfront create-invalidation --distribution-id "$CF_ID" --paths "/*"
